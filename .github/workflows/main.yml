name: Python CI parbaude

on: [push] # CI sāk darboties pēc katra git push

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Ielādēt kodu no GitHub
      uses: actions/checkout@v4
      
    - name: Uzstādīt Python versiju
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Atkāpe salabota (ielikti 2 papildu tukšumi pirms python-version)
      
    - name: Atjaunināt pip
      run: python -m pip install --upgrade pip
      
    - name: Palaist automātiskos testus
      run: python -m unittest discover
