name: Python CI pārbaude
on: [push] # CI sāk darboties pēc katra git push
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Ielādēt kodu no GitHub
      uses: actions/checkout@v3
      
    - name: Uzstādīt Python versiju
      uses: actions/setup-python@v4
      with:
      python-version: '3.10' # Saskaņots ar darba aprakstu
      
    - name: Atjaunināt pip
      run: python -m pip install --upgrade pip # Profesionāla vides sagatavošana
      
    - name: Palaist automātiskos testus
      run: |
        python -m unittest discover # Atrod un izpilda visus testus
